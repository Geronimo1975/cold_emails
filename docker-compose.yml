services:
  cold-email-app:
    build: ./app
    container_name: cold-email-app
    restart: unless-stopped
    ports:
      - "8100:8000"
    env_file: .env
    depends_on:
      cold-email-db:
        condition: service_healthy
      cold-email-redis:
        condition: service_started
    volumes:
      - ./app:/app
      - static_volume:/app/staticfiles
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120

  cold-email-celery:
    build: ./app
    container_name: cold-email-celery
    restart: unless-stopped
    command: celery -A config worker -l info -Q sending,tracking,warmup,default -c 4
    env_file: .env
    depends_on:
      cold-email-db:
        condition: service_healthy
      cold-email-redis:
        condition: service_started
    volumes:
      - ./app:/app

  cold-email-beat:
    build: ./app
    container_name: cold-email-beat
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    depends_on:
      cold-email-db:
        condition: service_healthy
      cold-email-redis:
        condition: service_started
    volumes:
      - ./app:/app

  cold-email-db:
    image: postgres:16-alpine
    container_name: cold-email-db
    restart: unless-stopped
    volumes:
      - cold_email_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: cold_email
      POSTGRES_USER: cold_email_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cold_email_user -d cold_email"]
      interval: 10s
      timeout: 5s
      retries: 5

  cold-email-redis:
    image: redis:7-alpine
    container_name: cold-email-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  cold_email_pgdata:
  static_volume:
