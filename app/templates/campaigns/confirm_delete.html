{% extends "base.html" %}
{% block title %}Delete Campaign{% endblock %}
{% block header %}Delete Campaign{% endblock %}
{% block content %}
<div class="max-w-md">
    <div class="bg-white rounded-xl shadow-sm p-6">
        <h2 class="text-lg font-semibold text-gray-900 mb-2">Are you sure?</h2>
        <p class="text-gray-600 mb-6">Delete campaign "<strong>{{ object.name }}</strong>"? This will also delete all email logs and enrollments.</p>
        <form method="post" class="flex gap-3">
            {% csrf_token %}
            <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-red-700 transition">Delete</button>
            <a href="/campaigns/{{ object.pk }}/" class="bg-white border border-gray-300 text-gray-700 px-6 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 transition">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
