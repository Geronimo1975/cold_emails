{% extends "base.html" %}
{% block title %}Delete Lead{% endblock %}
{% block content %}
<div class="max-w-md">
    <div class="bg-white rounded-xl shadow-sm p-6">
        <h2 class="text-lg font-semibold text-gray-900 mb-2">Delete Lead?</h2>
        <p class="text-gray-600 mb-6">Delete <strong>{{ object.business_name }}</strong> ({{ object.email }})? This cannot be undone.</p>
        <form method="post" class="flex gap-3">
            {% csrf_token %}
            <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded-lg text-sm font-medium">Delete</button>
            <a href="/leads/" class="bg-white border border-gray-300 text-gray-700 px-6 py-2 rounded-lg text-sm font-medium">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
