{% extends "base.html" %}
{% block title %}New Lead List{% endblock %}
{% block header %}New Lead List{% endblock %}
{% block content %}
<div class="max-w-md">
    <div class="bg-white rounded-xl shadow-sm p-6">
        <form method="post" class="space-y-5">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p class="text-red-500 text-xs mt-1">{{ field.errors|join:", " }}</p>{% endif %}
            </div>
            {% endfor %}
            <div class="flex gap-3">
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-medium">Create</button>
                <a href="/leads/lists/" class="bg-white border border-gray-300 text-gray-700 px-6 py-2 rounded-lg text-sm font-medium">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
