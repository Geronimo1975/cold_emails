<!DOCTYPE html>
<html lang="de" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abmeldung bestätigt</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center">
<div class="max-w-md w-full text-center px-4">
    <div class="bg-white rounded-xl shadow-md p-8">
        {% if unsubscribed %}
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Abmeldung erfolgreich</h1>
        <p class="text-gray-600 mb-4">Sie wurden erfolgreich von unserem E-Mail-Verteiler abgemeldet und erhalten keine weiteren E-Mails von uns.</p>
        {% else %}
        <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Bereits abgemeldet</h1>
        <p class="text-gray-600 mb-4">Diese E-Mail-Adresse ist bereits abgemeldet.</p>
        {% endif %}
        <div class="border-t border-gray-100 pt-4 mt-4">
            <p class="text-xs text-gray-400">North Cleaning Services GmbH<br>Hamburg, Deutschland</p>
        </div>
    </div>
</div>
</body>
</html>
