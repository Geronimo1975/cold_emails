{% extends "base.html" %}
{% block title %}Analytics{% endblock %}
{% block header %}Analytics{% endblock %}
{% block content %}
<div class="mb-6 flex items-center gap-4">
    <form method="get" class="flex items-center gap-3">
        <select name="campaign" onchange="this.form.submit()"
            class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">All Campaigns</option>
            {% for c in campaigns %}
            <option value="{{ c.pk }}" {% if selected_campaign_id == c.pk|stringformat:'s' %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
    </form>
</div>
<div class="bg-white rounded-xl p-6 shadow-sm mb-6">
    <h2 class="text-lg font-semibold text-gray-900 mb-4">Last 30 Days</h2>
    <canvas id="analyticsChart" height="80"></canvas>
</div>
<script>
const labels = [{% for d in daily_stats %}"{{ d.date }}"{% if not forloop.last %},{% endif %}{% endfor %}];
const sent = [{% for d in daily_stats %}{{ d.sent }}{% if not forloop.last %},{% endif %}{% endfor %}];
const opened = [{% for d in daily_stats %}{{ d.opened }}{% if not forloop.last %},{% endif %}{% endfor %}];
const clicked = [{% for d in daily_stats %}{{ d.clicked }}{% if not forloop.last %},{% endif %}{% endfor %}];
const replied = [{% for d in daily_stats %}{{ d.replied }}{% if not forloop.last %},{% endif %}{% endfor %}];
new Chart(document.getElementById('analyticsChart'), {
    type: 'line',
    data: {
        labels,
        datasets: [
            { label: 'Sent', data: sent, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', tension: 0.3 },
            { label: 'Opened', data: opened, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', tension: 0.3 },
            { label: 'Clicked', data: clicked, borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.1)', tension: 0.3 },
            { label: 'Replied', data: replied, borderColor: '#8b5cf6', backgroundColor: 'rgba(139,92,246,0.1)', tension: 0.3 },
        ]
    },
    options: { plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true } } }
});
</script>
{% endblock %}
